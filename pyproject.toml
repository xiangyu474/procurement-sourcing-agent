[project]
name = "procurement-sourcing-agent"
version = "0.1.0"
description = "Procurement sourcing intelligence agent: demand-driven supplier discovery, evidence-backed specification matching, and reference price comparison."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.32",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.1.14",
    "langsmith>=0.3.37",
    "pydantic>=2.11",
    "python-dotenv>=1.0.1",
    "tavily-python>=0.5.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12",
    "pandas>=2.3.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["procurement_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
